[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrk-transcriber"
version = "0.1.0"
description = "Capture and transcribe media from NRK, YouTube, podcasts, and more using Whisper"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["nrk", "radio", "transcription", "whisper", "speech-to-text", "norwegian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.2.0",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    "numpy>=1.24.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
gpu = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
openai-whisper = [
    "openai-whisper>=20231117",
]
youtube = [
    "yt-dlp>=2024.0.0",
]
all = [
    "yt-dlp>=2024.0.0",
]

[project.scripts]
nrk-transcriber = "nrk_transcriber.cli:main"

[project.urls]
Homepage = "https://github.com/haidersbq/NRKtrancriber"
Repository = "https://github.com/haidersbq/NRKtrancriber"
Issues = "https://github.com/haidersbq/NRKtrancriber/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nrk_transcriber*"]

[tool.setuptools.package-data]
nrk_transcriber = ["../config/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM", "ARG"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
